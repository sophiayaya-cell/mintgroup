name = "mintgroup-auth"
main = "worker.js"
compatibility_date = "2024-09-23"

# 把 /api/* 全部路由到本 Worker；其余 www.mint-gp.com 请求仍由 mintgroup(Pages) 处理
routes = [
  { pattern = "www.mint-gp.com/api/*", zone_name = "mint-gp.com" }
]

# 密钥请用以下命令设置（不要写进本文件）：
#   wrangler secret put GITHUB_CLIENT_ID  --name mintgroup-auth
#   wrangler secret put GITHUB_CLIENT_SECRET --name mintgroup-auth
